<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1592A">
<title>SGArtes · Aulas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--brand:#F1592A;--brand-d:#c9431a;--brand-l:#fff0ea;--ink:#241f1c;--mut:#665a53;--line:#efe6df;--bg:#fffaf6;--card:#fff;--ok:#1f7a45;--ok-l:#e5f7ec;--bad:#c0392b;--bad-l:#fdeceb;--rgpd:#5b4bc4;--rgpd-l:#eeedfe;--warn:#a35f00;--warn-l:#fff3d6;--r:22px;--sh:0 2px 4px #5a2a1008,0 10px 28px #5a2a1012}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15.5px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s,box-shadow .12s,background .12s}
button:active,.btn:active{transform:scale(.97)}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--brand-d);color:#fff;display:flex;align-items:center;gap:8px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));border-radius:0 0 26px 26px;box-shadow:0 8px 24px #f1592a40}
.top b{font-size:17px;flex:1;letter-spacing:-.2px}
.top .chip{background:#ffffff38;color:#fff;border:0;min-height:36px;backdrop-filter:blur(6px)}
.demo{background:#fff3d6;color:#7a5200;text-align:center;font-size:13px;padding:7px 14px;margin:10px 16px 0;border-radius:12px}
main{flex:1;padding:18px 16px 110px}
main.flow{padding-bottom:28px}
h1{font-size:24px;margin:4px 0 6px;line-height:1.15;letter-spacing:-.5px;font-weight:800}
h2{font-size:17px;margin:26px 0 10px;font-weight:800}
.cap{font-size:14px}.mut{color:var(--mut)}.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.card{background:var(--card);border:0;border-radius:var(--r);padding:18px;margin:0 0 14px;box-shadow:var(--sh)}
.hero{background:linear-gradient(160deg,#fff,#fff0e8);box-shadow:0 0 0 2px #F1592A33,var(--sh)}
.hero-t{font-size:22px;font-weight:800;line-height:1.15;margin:2px 0;letter-spacing:-.4px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 13px;font-size:13px;font-weight:700;background:#f4ece6;color:var(--mut);border:0;white-space:nowrap}
.chip.ok{background:var(--ok-l);color:var(--ok)}.chip.warn{background:var(--warn-l);color:var(--warn)}.chip.rgpd{background:var(--rgpd-l);color:var(--rgpd)}.chip.bad{background:var(--bad-l);color:var(--bad)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;border-radius:18px;border:2px solid #F1592A44;background:#fff;color:var(--brand-d);font-weight:700;font-size:16px;width:100%;text-decoration:none;text-align:center;line-height:1.2;box-shadow:0 2px 0 #f1592a14}
.btn.primary{background:var(--brand-d);border-color:transparent;color:#fff;box-shadow:0 4px 12px #c9431a40}
.btn.ok{background:linear-gradient(180deg,#2bb56b,#1f9d57);border-color:transparent;color:#fff;box-shadow:0 8px 18px #1f9d5744}
.btn.bad{border-color:#c0392b55;color:var(--bad);background:#fff}
.btn.ghost{border-color:var(--line);background:#fff;color:var(--ink);font-weight:700;box-shadow:var(--sh)}
.btn.small{min-height:42px;font-size:14.5px;width:auto;padding:0 18px;border-radius:16px}
.btn[disabled]{opacity:.38;pointer-events:none;box-shadow:none}
.link{background:none;border:0;color:var(--brand-d);font-weight:700;padding:10px 4px;font-size:16px}
.icon{width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:var(--sh);font-size:18px;flex:none}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav{position:fixed;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));background:#ffffffee;backdrop-filter:blur(12px);border-radius:26px;box-shadow:0 10px 34px #5a2a1030;z-index:6;max-width:536px;margin:0 auto}
.nav-in{display:flex;padding:6px}
.nav button{flex:1;border:0;background:none;padding:7px 4px;font-size:12px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;border-radius:20px}
.nav button.on{color:var(--brand-d);background:var(--brand-l)}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;overflow:hidden;font-size:17px;box-shadow:0 0 0 3px #fff,0 3px 10px #0002}
.av.big{width:min(48vw,190px);height:min(48vw,190px);font-size:60px;box-shadow:0 0 0 6px #fff,0 12px 30px #0003}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.card.row{border-bottom:0;padding:16px 18px}
.row .grow{flex:1;min-width:0}
.flowtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.steps{display:flex;gap:6px;margin:4px 0 14px}
.steps i{flex:1;height:7px;border-radius:4px;background:#f1e4db}
.steps i.on{background:linear-gradient(90deg,#ff7a3d,#F1592A)}
.deck{position:relative;height:min(52vh,400px);margin:12px 0 16px}
.sw{position:absolute;inset:0 6px;background:#fff;border:3px solid #fff;border-radius:32px;box-shadow:0 16px 40px #5a2a1026;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform}
.sw[data-dir=yes]{border-color:var(--ok);background:var(--ok-l)}
.sw[data-dir=no]{border-color:var(--bad);background:var(--bad-l)}
.sw .nm{font-size:21px;font-weight:800;text-align:center;padding:0 16px;line-height:1.25;letter-spacing:-.3px}
.sw .hint{position:absolute;bottom:14px;font-size:14px;color:var(--mut)}
.decide{display:flex;gap:12px}
.decide .btn{min-height:60px;font-size:18px;border-radius:22px}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.ctr{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ctr-in{display:flex;align-items:center;gap:12px}
.ctr .n{font-size:50px;font-weight:800;min-width:76px;text-align:center;line-height:1;letter-spacing:-2px}
.round{width:70px;height:70px;border-radius:50%;border:0;background:#fff;font-size:36px;color:var(--brand-d);font-weight:700;line-height:1;box-shadow:var(--sh),inset 0 0 0 2px #F1592A33}
.round.plus{background:var(--brand-d);color:#fff;box-shadow:0 4px 12px #c9431a40}
.namechips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.namechip{min-height:40px;padding:0 14px;border-radius:999px;border:0;background:#fff;font-weight:600;font-size:14.5px;box-shadow:var(--sh)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.th{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;background:#eee;border:0;padding:0;box-shadow:var(--sh)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .tag{position:absolute;left:6px;bottom:6px;background:var(--brand-d);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.th .x{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:16px}
.shot{border:3px dashed #F1592A88;background:var(--brand-l);color:var(--brand-d);min-height:130px;font-size:20px;flex-direction:column;box-shadow:none;border-radius:26px}
.in{width:100%;min-height:52px;border:2px solid transparent;border-radius:16px;padding:8px 14px;background:#fff;font-size:16px;box-shadow:var(--sh)}
.in:focus{outline:none;border-color:var(--brand)}
textarea.in{min-height:96px;resize:vertical}
label.l{display:block;font-weight:700;margin:16px 0 8px}
.seg{display:flex;gap:8px}
.seg button,.pill{min-height:52px;border-radius:18px;border:2px solid transparent;background:#fff;font-weight:700;flex:1;box-shadow:var(--sh)}
.pill{flex:none;padding:0 17px;border-radius:999px;min-height:46px}
.seg button.on,.pill.on{border-color:var(--brand);background:var(--brand-l);color:var(--brand-d)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.padwrap{position:relative}
.padwrap::before{content:"Assine aqui com o dedo ✍️";position:absolute;inset:0;display:grid;place-items:center;color:#cdbfb4;font-size:18px;pointer-events:none}
.padwrap.has::before{display:none}
.pad{width:100%;height:190px;border:2px dashed #e3cfc2;border-radius:22px;background:#fff;touch-action:none;display:block}
.hintline{color:var(--warn);background:var(--warn-l);border-radius:16px;padding:11px 16px;font-weight:700;margin:12px 0}
.foot{position:sticky;bottom:0;background:linear-gradient(#fff8f300,var(--bg) 24%);padding:20px 0 max(8px,env(safe-area-inset-bottom));display:flex;gap:10px;margin-top:8px}
.foot .btn.ghost{width:34%;flex:none}
.okmark{width:92px;height:92px;border-radius:50%;background:linear-gradient(180deg,#2bb56b,#1f9d57);color:#fff;font-size:52px;display:grid;place-items:center;margin:10px auto 6px;box-shadow:0 12px 28px #1f9d5755}
.ov{position:fixed;inset:0;background:#2a14087a;backdrop-filter:blur(3px);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:32px 32px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:18px}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:#2b2320;color:#fff;padding:13px 20px;border-radius:18px;z-index:40;max-width:92%;font-size:16px;text-align:center;box-shadow:0 10px 30px #0004}
.sheetscroll{overflow:auto;border-radius:16px;background:#fff;padding:10px;box-shadow:var(--sh)}@media print{body.np>*{display:none!important}}
.sheetscroll>div{min-width:860px}
.staff{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto}
.staff-in{max-width:560px;margin:0 auto;padding:24px 18px calc(24px + env(safe-area-inset-bottom))}
.staff .pad{height:300px}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 22px;text-align:center;gap:10px}
.check{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid transparent}
.check.on{border-color:var(--ok);background:var(--ok-l)}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:#fff;font-weight:800;color:var(--ok)}
</style>
</head>

/* ---------- armazenamento local (IndexedDB com reserva em memória) ---------- */
const kv = (() => {
  let db = null; const mem = new Map();
  const ready = new Promise(res => {
    try {
      const r = indexedDB.open('sgartes-aulas', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { db = r.result; res(); };
      r.onerror = () => res();
      r.onblocked = () => res();
    } catch (e) { res(); }
  });
  const run = (mode, fn) => new Promise((res, rej) => {
    try {
      const t = db.transaction('kv', mode); const rq = fn(t.objectStore('kv'));
      t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    } catch (e) { rej(e); }
  });
  return {
    async get(k, d) { await ready; if (db) { try { const v = await run('readonly', s => s.get(k)); if (v !== undefined) return v; } catch (e) { } } return mem.has(k) ? mem.get(k) : d; },
    async set(k, v) { await ready; mem.set(k, v); if (db) { try { await run('readwrite', s => s.put(v, k)); } catch (e) { } } },
    async del(k) { await ready; mem.delete(k); if (db) { try { await run('readwrite', s => s.delete(k)); } catch (e) { } } }
  };
})();

/* ---------- imagens ---------- */
function loadImg(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Não consegui abrir a imagem.')); };
    im.src = url;
  });
}
async function shrink(file, max, q) {
  const im = await loadImg(file);
  const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
async function squareThumb(file, size) {
  const im = await loadImg(file); const s = Math.min(im.naturalWidth, im.naturalHeight);
  const c = document.createElement('canvas'); c.width = c.height = size;
  c.getContext('2d').drawImage(im, (im.naturalWidth - s) / 2, (im.naturalHeight - s) / 2, s, s, 0, 0, size, size);
  let out = c.toDataURL('image/jpeg', .72);
  if (out.length > 40000) out = c.toDataURL('image/jpeg', .5);
  return out;
}
function dataUrlToBlob(u) {
  const [head, b64] = u.split(','); const mime = (head.match(/:(.*?);/) || [])[1] || 'image/jpeg';
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

/* ---------- assinatura (canvas) ---------- */
function makePad(initial, onChange) {
  const cv = h('canvas', { class: 'pad' }); const wrap = h('div', { class: 'padwrap' + (initial ? ' has' : '') }, cv);
  let ctx = null, W = 0, H = 0, drawing = false, last = null, ink = !!initial;
  const size = () => {
    const r = cv.getBoundingClientRect(); if (!r.width) return false;
    const dpr = window.devicePixelRatio || 1; cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    ctx = cv.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineWidth = 3.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; ctx.fillStyle = '#111';
    W = r.width; H = r.height;
    if (initial) { const im = new Image(); im.onload = () => ctx && ctx.drawImage(im, 0, 0, W, H); im.src = initial; }
    return true;
  };
  const pt = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.addEventListener('pointerdown', e => {
    if (!ctx && !size()) return; e.preventDefault(); cv.setPointerCapture(e.pointerId);
    drawing = true; last = pt(e); ink = true; wrap.classList.add('has');
    ctx.beginPath(); ctx.arc(last.x, last.y, 1.6, 0, Math.PI * 2); ctx.fill();
  });
  cv.addEventListener('pointermove', e => {
    if (!drawing) return; const p = pt(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p;
  });
  const end = () => { if (!drawing) return; drawing = false; onChange(exportPng()); };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  function exportPng() {
    if (!ink || !ctx) return null;
    const out = document.createElement('canvas'); out.width = 600; out.height = Math.round(600 * H / W);
    out.getContext('2d').drawImage(cv, 0, 0, out.width, out.height); return out.toDataURL('image/png');
  }
  requestAnimationFrame(() => size());
  return {
    el: wrap,
    clear() { if (ctx || size()) { ctx.clearRect(0, 0, W, H); } ink = false; initial = null; wrap.classList.remove('has'); onChange(null); }
  };
}

const gs = async (fn, ...args) => {
  const name = fn.replace(/^api/, '').replace(/^./, c => c.toLowerCase());
  let res, r;
  try { res = await fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify({ fn: name, args, token: TOKEN }) }); }
  catch (e) { throw Object.assign(new Error('Sem ligação ao servidor.'), { server: false }); }
  try { r = await res.json(); } catch (e) { throw Object.assign(new Error('O servidor respondeu de forma inesperada.'), { server: false }); }
  if (r && r.auth) { authLost(); throw Object.assign(new Error(r.error), { server: false, auth: true }); }
  if (r && r.ok === false) throw Object.assign(new Error(r.error || 'Erro no servidor'), { server: true });
  return r;
};
